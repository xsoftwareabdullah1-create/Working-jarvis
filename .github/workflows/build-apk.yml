name: Build Jarvis APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Finds the Flutter project automatically, wherever it sits in the repo.
      - name: Locate Flutter project
        id: locate
        run: |
          PUBSPEC=$(find . -maxdepth 4 -name pubspec.yaml \
            -not -path '*/.*' -not -path '*/build/*' -not -path '*/ephemeral/*' \
            | awk '{ print length($0) " " $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml not found. Repo contents:"
            ls -R | head -80
            exit 1
          fi
          DIR=$(dirname "$PUBSPEC")
          echo "Flutter project found in: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      # 1) Repairs .dart files that were uploaded into a wrongly named folder
      #    (e.g. lib/screen/ instead of lib/screens/) by copying them to the
      #    expected path. 2) Fails with a clear list if anything is still missing.
      - name: Repair misplaced files and verify
        run: |
          DIR="${{ steps.locate.outputs.dir }}"
          LIST=".github/required-files.txt"
          if [ ! -f "$LIST" ]; then echo "No $LIST found, skipping check."; exit 0; fi

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$DIR/$f" ] && continue
            case "$f" in *.dart) ;; *) continue ;; esac
            base=$(basename "$f")
            mapfile -t found < <(find "$DIR" -type f -name "$base" -not -path '*/build/*' -not -path '*/.dart_tool/*')
            if [ "${#found[@]}" -eq 1 ]; then
              mkdir -p "$DIR/$(dirname "$f")"
              cp "${found[0]}" "$DIR/$f"
              echo "::warning::Repaired misplaced file: ${found[0]} -> $DIR/$f (please move it in your repo)"
            fi
          done < "$LIST"

          MISSING=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ ! -f "$DIR/$f" ]; then
              echo "::error::MISSING FILE: $f"
              MISSING=$((MISSING+1))
            fi
          done < "$LIST"
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING file(s) are missing from the repo. Upload them (same folder paths) and re-run."
            exit 1
          fi
          echo "All $(wc -l < "$LIST") files present."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Lower Gradle memory for CI
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError/' android/gradle.properties

      - name: Get dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter pub get

      # Reported only - these never block the APK build.
      - name: Analyze
        working-directory: ${{ steps.locate.outputs.dir }}
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: ${{ steps.locate.outputs.dir }}
        continue-on-error: true
        run: flutter test

      - name: Build release APK (universal)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter build apk --release

      - name: Build release APKs (split per ABI)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter build apk --release --split-per-abi

      - name: List APKs
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: ${{ steps.locate.outputs.dir }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.dir }}/build/app/outputs/flutter-apk/*.apk
