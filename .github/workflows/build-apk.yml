name: Build Jarvis APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Finds the Flutter project automatically, wherever it sits in the repo.
      - name: Locate Flutter project
        id: locate
        run: |
          PUBSPEC=$(find . -maxdepth 4 -name pubspec.yaml \
            -not -path '*/.*' -not -path '*/build/*' -not -path '*/ephemeral/*' \
            | awk '{ print length($0) " " $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml not found. Repo contents:"
            ls -R | head -80
            exit 1
          fi
          DIR=$(dirname "$PUBSPEC")
          echo "Flutter project found in: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      # Reads the Dart import lines, and if an imported file is missing but
      # exists elsewhere in the repo under the same name (e.g. uploaded to
      # lib/screen/ instead of lib/screens/), copies it to the expected path.
      # Needs no extra files. Fails with a clear list if something is truly missing.
      - name: Repair misplaced files and verify
        run: |
          python3 - "${{ steps.locate.outputs.dir }}" <<'PY'
          import os, re, shutil, sys
          d = sys.argv[1]
          m = re.search(r'^name:\s*(\S+)', open(os.path.join(d, 'pubspec.yaml')).read(), re.M)
          pkg = m.group(1) if m else ''
          skip = {'build', '.dart_tool', '.git', '.github'}
          pat = re.compile(r"""^\s*(?:import|export|part)\s+['"]([^'"]+)['"]""", re.M)

          def dart_files():
              for root, dirs, files in os.walk(d):
                  dirs[:] = [x for x in dirs if x not in skip]
                  for f in files:
                      if f.endswith('.dart'):
                          yield os.path.join(root, f)

          def resolve(src, imp):
              if imp.startswith('dart:'):
                  return None
              if imp.startswith('package:'):
                  if pkg and imp.startswith('package:%s/' % pkg):
                      return os.path.join(d, 'lib', imp[len('package:%s/' % pkg):])
                  return None
              return os.path.normpath(os.path.join(os.path.dirname(src), imp))

          missing = {}
          for _ in range(6):
              files = list(dart_files())
              byname = {}
              for f in files:
                  byname.setdefault(os.path.basename(f), []).append(f)
              missing = {}
              repaired = False
              for f in files:
                  if not os.path.isfile(f):
                      continue
                  text = open(f, encoding='utf-8', errors='ignore').read()
                  for imp in pat.findall(text):
                      t = resolve(f, imp)
                      if not t or os.path.isfile(t):
                          continue
                      c = byname.get(os.path.basename(t), [])
                      if len(c) == 1:
                          os.makedirs(os.path.dirname(t), exist_ok=True)
                          shutil.move(c[0], t)
                          print('::warning::Moved misplaced file: %s -> %s' % (c[0], t))
                          repaired = True
                      else:
                          missing[t] = f
              if not repaired:
                  break

          if missing:
              for t, f in sorted(missing.items()):
                  print('::error::MISSING FILE: %s (imported by %s)' % (t, f))
              print('::error::%d file(s) are missing from the repo. Upload them and re-run.' % len(missing))
              sys.exit(1)
          print('All imported Dart files are present.')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Lower Gradle memory for CI
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError/' android/gradle.properties

      - name: Get dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter pub get

      # Reported only - these never block the APK build.
      - name: Analyze
        working-directory: ${{ steps.locate.outputs.dir }}
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: ${{ steps.locate.outputs.dir }}
        continue-on-error: true
        run: flutter test

      - name: Build release APK (universal)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter build apk --release

      - name: Build release APKs (split per ABI)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter build apk --release --split-per-abi

      - name: List APKs
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: ${{ steps.locate.outputs.dir }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.dir }}/build/app/outputs/flutter-apk/*.apk
