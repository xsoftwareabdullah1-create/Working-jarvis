name: Build Jarvis APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Finds the Flutter project automatically, wherever it sits in the repo.
      - name: Locate Flutter project
        id: locate
        run: |
          PUBSPEC=$(find . -maxdepth 4 -name pubspec.yaml \
            -not -path '*/.*' -not -path '*/build/*' -not -path '*/ephemeral/*' \
            | awk '{ print length($0) " " $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$PUBSPEC" ]; then
            echo "::error::pubspec.yaml not found. Repo contents:"
            ls -R | head -80
            exit 1
          fi
          DIR=$(dirname "$PUBSPEC")
          echo "Flutter project found in: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Lower Gradle memory for CI
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError/' android/gradle.properties

      - name: Get dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter pub get

      # Reported only - these never block the APK build.
      - name: Analyze
        working-directory: ${{ steps.locate.outputs.dir }}
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: ${{ steps.locate.outputs.dir }}
        continue-on-error: true
        run: flutter test

      - name: Build release APK (universal)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter build apk --release

      - name: Build release APKs (split per ABI)
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter build apk --release --split-per-abi

      - name: List APKs
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: ${{ steps.locate.outputs.dir }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.dir }}/build/app/outputs/flutter-apk/*.apk
